name: PPS priority release

on:
  workflow_dispatch:
  push:
    branches: ["audit/pps-priority-20260928"]
    paths:
      - "assets/priority-regimens.js"
      - "scripts/install-priority-block.cjs"
      - "tests/priority-regimens.test.cjs"
      - "tests/priority-browser.py"
      - ".github/workflows/pps-priority-release.yml"

permissions:
  contents: write

concurrency:
  group: pps-priority-regimens-audit
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Verify calculation and real browser integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          node --test tests/priority-regimens.test.cjs | tee ci-artifacts/math-tests.log
          python -m http.server 8000 >ci-artifacts/http-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 1
          done
          if ! grep -q 'assets/priority-regimens.js' index.html; then
            set +e
            python tests/priority-browser.py --baseline >ci-artifacts/browser-red.log 2>&1
            BASELINE_EXIT=$?
            set -e
            test "$BASELINE_EXIT" -ne 0
            grep -q 'RED: os esquemas reconciliados ainda' ci-artifacts/browser-red.log
            echo 'Expected missing integration observed before installation.'
          fi
          node scripts/install-priority-block.cjs | tee ci-artifacts/candidate-audit.log
          python tests/priority-browser.py | tee ci-artifacts/browser-tests.log
          git diff --check
      - name: Save reproducible test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pps-priority-verification
          path: ci-artifacts/
          retention-days: 30
      - name: Commit integrated files only after successful verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pps-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html public-data/catalog.json public-data/priority-regimens.json public-data/priority-candidate-audit.json
          if git diff --cached --quiet; then
            echo 'No integration changes.'
            exit 0
          fi
          git commit -m "feat: activate tested priority pediatric regimens"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
